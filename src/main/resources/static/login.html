<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 bg-gradient-to-br from-slate-100 via-indigo-50 to-slate-100 font-sans">

    <!-- Decorative blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-200/40 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-purple-200/30 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md animate-fade-in-up">
        <!-- Card -->
        <div class="glass-card rounded-2xl shadow-xl shadow-slate-200/50 ring-1 ring-slate-200/50 px-8 py-10 sm:px-10 sm:py-12 text-center">

            <!-- Logo -->
            <div class="animate-float mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-indigo-200">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                    </svg>
                </div>
            </div>

            <h1 class="text-2xl font-bold text-slate-800 mb-1">Parking Scanner</h1>
            <p class="text-sm text-slate-500 mb-8" id="subtitle">Sign in to manage parking and scan plates</p>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm placeholder-slate-400 outline-none transition-all focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm placeholder-slate-400 outline-none transition-all focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white">
                </div>
                <button type="submit" id="loginBtn"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-semibold text-sm shadow-md shadow-indigo-200 hover:shadow-lg hover:shadow-indigo-300 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-md cursor-pointer">
                    Sign In
                </button>
            </form>

            <div class="mt-5 text-sm text-slate-500" id="showSignup">
                Don't have an account? <a onclick="toggleForms('signup')" class="text-indigo-600 font-medium hover:text-indigo-700 cursor-pointer hover:underline">Sign Up</a>
            </div>

            <!-- Sign Up Form (hidden) -->
            <form id="signupForm" class="hidden space-y-4 text-left">
                <div>
                    <label for="signupEmail" class="block text-sm font-medium text-slate-700 mb-1.5">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="your.email@example.com" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm placeholder-slate-400 outline-none transition-all focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100 focus:bg-white">
                </div>
                <button type="submit" id="signupBtn"
                    class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white font-semibold text-sm shadow-md shadow-emerald-200 hover:shadow-lg hover:shadow-emerald-300 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:shadow-md cursor-pointer">
                    Request Access
                </button>
            </form>

            <div class="mt-5 text-sm text-slate-500 hidden" id="showLogin">
                Already have an account? <a onclick="toggleForms('login')" class="text-indigo-600 font-medium hover:text-indigo-700 cursor-pointer hover:underline">Sign In</a>
            </div>

            <!-- Message -->
            <div id="msg" class="hidden mt-5 text-sm px-4 py-3 rounded-xl"></div>

            <div class="mt-8 text-xs text-slate-400">Parking Management System</div>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const msgEl = document.getElementById('msg');

    function showMsg(text, type) {
        msgEl.textContent = text;
        msgEl.className = 'mt-5 text-sm px-4 py-3 rounded-xl ' + (
            type === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200'
            : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
        );
    }

    if (params.has('logout')) {
        showMsg('You have been logged out successfully.', 'info');
    } else if (params.has('expired')) {
        showMsg('Your session has expired. Please sign in again.', 'error');
    }

    // Already logged in → redirect
    if (localStorage.getItem('jwt_token')) {
        window.location.href = '/dashboard.html';
    }

    function toggleForms(mode) {
        msgEl.className = 'hidden';
        if (mode === 'signup') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('showSignup').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('showLogin').classList.remove('hidden');
            document.getElementById('subtitle').textContent = 'Request access to the parking system';
        } else {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('showSignup').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('showLogin').classList.add('hidden');
            document.getElementById('subtitle').textContent = 'Sign in to manage parking and scan plates';
        }
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.className = 'hidden';
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('jwt_username', data.username);
                localStorage.setItem('jwt_role', data.role);
                window.location.href = '/dashboard.html';
            } else {
                showMsg(data.error || 'Authentication failed. Please try again.', 'error');
            }
        } catch (err) {
            showMsg('Connection error. Please try again.', 'error');
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    // Signup
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.className = 'hidden';
        const signupBtn = document.getElementById('signupBtn');
        signupBtn.disabled = true;
        signupBtn.textContent = 'Submitting...';

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('signupEmail').value.trim() })
            });
            const data = await res.json();
            if (res.ok) {
                showMsg(data.message || 'Request submitted! An administrator will review your request.', 'info');
                document.getElementById('signupForm').reset();
            } else {
                showMsg(data.error || 'Failed to submit request.', 'error');
            }
        } catch (err) {
            showMsg('Connection error. Please try again.', 'error');
        } finally {
            signupBtn.disabled = false;
            signupBtn.textContent = 'Request Access';
        }
    });
</script>
</body>
</html>
