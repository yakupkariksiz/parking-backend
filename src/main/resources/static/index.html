<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scan Plates – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
    <link rel="stylesheet" href="/common.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

<!-- Side selection modal -->
<div id="side-overlay" class="modal-overlay show">
    <div class="modal-panel max-w-sm w-[92%]">
        <div class="flex items-center justify-between mb-5">
            <h2 class="text-lg font-semibold text-slate-800">Select parking side</h2>
            <button type="button" id="side-close-btn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <select id="side-select" class="form-select mb-4">
            <option value="" disabled selected>Select side...</option>
            <option value="NORTH">North</option>
            <option value="SOUTH">South</option>
        </select>
        <button type="button" id="side-confirm-btn" class="btn-primary w-full btn-press">Continue</button>
        <p class="text-xs text-slate-400 text-center mt-3">You can close this and select later using the "Change side" button.</p>
    </div>
</div>

<!-- Main content -->
<main class="max-w-xl mx-auto px-4 sm:px-6 pt-6 pb-24 page-fade-in">

    <div class="bg-white rounded-xl border border-slate-200/80 shadow-sm overflow-hidden">

        <!-- Card header -->
        <div class="px-5 pt-5 pb-4 border-b border-slate-100">
            <h1 class="text-lg font-semibold text-slate-800 text-center">Parking Scanner</h1>
        </div>

        <form id="scan-form" class="p-5 space-y-4">

            <!-- Session name -->
            <div>
                <label for="sessionName" class="block text-sm font-semibold text-slate-700 mb-1.5">Scan session name</label>
                <input type="text" id="sessionName" name="sessionName" placeholder="MORNING-2025-11-25" class="form-input" />
                <!-- Session chips -->
                <div id="session-suggestions" class="hidden mt-2 flex-wrap gap-1.5 items-center">
                    <span class="text-xs text-slate-400 mr-1">Quick set:</span>
                    <button type="button" class="session-chip px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-pointer border-none" data-period="MORNING">Morning</button>
                    <button type="button" class="session-chip px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-pointer border-none" data-period="NOON">Noon</button>
                    <button type="button" class="session-chip px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-pointer border-none" data-period="EVENING">Evening</button>
                    <button type="button" class="session-chip px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition-colors cursor-pointer border-none" id="session-today-auto">Auto (now)</button>
                </div>
            </div>

            <!-- Change parking side button -->
            <button type="button" id="change-side-btn" class="btn-secondary w-full btn-press">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                </svg>
                Change parking side
            </button>

            <!-- License plate -->
            <div>
                <label for="licensePlate" class="block text-sm font-semibold text-slate-700 mb-1.5">License plate</label>
                <input type="text" id="licensePlate" name="licensePlate" placeholder="HHL32H" class="form-input awesomplete" required oninput="this.value = this.value.toUpperCase()" />
                <div id="plate-status" class="text-xs mt-1 h-4 text-slate-500"></div>
            </div>

            <!-- Slot row / spot navigator -->
            <div id="slot-row" class="hidden bg-slate-50 rounded-lg px-4 py-3">
                <div class="flex items-center justify-between flex-wrap gap-2">
                    <div class="flex items-center gap-2.5">
                        <span class="text-xs text-slate-400 font-medium">Spot:</span>
                        <button type="button" id="spot-dec" class="w-7 h-7 rounded-full border-2 border-indigo-400 text-indigo-500 bg-white flex items-center justify-center text-sm font-bold hover:bg-indigo-500 hover:text-white hover:scale-110 active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-indigo-400 disabled:hover:scale-100" title="Decrease spot number">-</button>
                        <span id="slot-label" class="text-sm font-bold text-slate-800 min-w-[80px] text-center">-</span>
                        <button type="button" id="spot-inc" class="w-7 h-7 rounded-full border-2 border-indigo-400 text-indigo-500 bg-white flex items-center justify-center text-sm font-bold hover:bg-indigo-500 hover:text-white hover:scale-110 active:scale-95 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:text-indigo-400 disabled:hover:scale-100" title="Increase spot number">+</button>
                    </div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <button type="button" id="slot-prev" class="px-2.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Prev</button>
                        <button type="button" id="slot-next" class="px-2.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
                        <button type="button" id="clear-history-btn" class="px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 transition-colors cursor-pointer" title="Clear all saved entries">Clear</button>
                    </div>
                </div>
            </div>

            <!-- No parking checkbox -->
            <label class="flex items-center gap-2.5 text-sm cursor-pointer select-none">
                <input type="checkbox" id="no-parking-checkbox" class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                <span class="text-slate-600">This spot is a <strong class="text-slate-800">NO PARKING</strong> area</span>
            </label>

            <!-- Submit -->
            <button type="submit" id="submit-btn" class="btn-success w-full py-3.5 text-base btn-press">Submit</button>
        </form>
    </div>

</main>

<script src="/common.js"></script>
<script>
    requireAuth();
    renderNavDrawer('scan');
    loadCurrentUser();

    const form = document.getElementById('scan-form');
    const submitBtn = document.getElementById('submit-btn');

    const plateStatusEl = document.getElementById('plate-status');
    const sessionInput = document.getElementById('sessionName');
    const sessionSuggestions = document.getElementById('session-suggestions');

    const licensePlateInput = document.getElementById('licensePlate');
    const noParkingCheckbox = document.getElementById('no-parking-checkbox');

    // Slot / automatic counter elements
    const slotRow = document.getElementById('slot-row');
    const slotLabelEl = document.getElementById('slot-label');
    const slotPrevBtn = document.getElementById('slot-prev');
    const slotNextBtn = document.getElementById('slot-next');

    // Side selection elements
    const sideOverlay = document.getElementById('side-overlay');
    const sideSelect = document.getElementById('side-select');
    const sideConfirmBtn = document.getElementById('side-confirm-btn');
    const sideCloseBtn = document.getElementById('side-close-btn');
    const changeSideBtn = document.getElementById('change-side-btn');

    // Currently selected side ("NORTH" or "SOUTH")
    let selectedSide = null;

    // Automatic counter for spots on the chosen side
    let currentIndex = 1; // 1-based

    // --- Persistence helpers for current spot per side ---
    const STORAGE_KEY_NORTH = 'scanner_current_index_north';
    const STORAGE_KEY_SOUTH = 'scanner_current_index_south';
    const STORAGE_KEY_HISTORY = 'scanner_plate_history';

    // History tracking: Map of location -> license plate
    let plateHistory = {};

    function loadPlateHistory() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY_HISTORY);
            if (stored) plateHistory = JSON.parse(stored);
        } catch (err) {
            console.warn('Failed to load plate history', err);
            plateHistory = {};
        }
    }

    function savePlateHistory() {
        try {
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(plateHistory));
        } catch (err) {
            console.warn('Failed to save plate history', err);
        }
    }

    function storePlateForLocation(location, plate) {
        plateHistory[location] = plate;
        savePlateHistory();
    }

    function getPlateForLocation(location) {
        return plateHistory[location] || null;
    }

    // Known plates + Awesomplete
    let knownPlatesSet = new Set();
    let awesomplete = null;
    let residentPlatesSet = new Set();
    let outsiderPlatesSet = new Set();

    loadPlateHistory();

    async function loadKnownPlates() {
        try {
            const res = await fetch('/plates/known', { headers: getAuthHeaders() });
            if (!res.ok) return;
            const data = await res.json();

            let allPlatesUpper = [];
            residentPlatesSet = new Set();
            outsiderPlatesSet = new Set();

            if (Array.isArray(data)) {
                allPlatesUpper = data.map(p => p.toUpperCase());
            } else if (data && (Array.isArray(data.residents) || Array.isArray(data.outsiders))) {
                const residentUpper = (data.residents || []).map(p => p.toUpperCase());
                const outsiderUpper = (data.outsiders || []).map(p => p.toUpperCase());
                residentUpper.forEach(p => residentPlatesSet.add(p));
                outsiderUpper.forEach(p => outsiderPlatesSet.add(p));
                allPlatesUpper = Array.from(new Set([...residentUpper, ...outsiderUpper]));
            } else {
                return;
            }

            knownPlatesSet = new Set(allPlatesUpper);

            if (window.Awesomplete) {
                if (!awesomplete) {
                    awesomplete = new Awesomplete(licensePlateInput, {
                        list: allPlatesUpper,
                        minChars: 1,
                        maxItems: 10,
                        autoFirst: true
                    });
                } else {
                    awesomplete.list = allPlatesUpper;
                }
            }
        } catch (err) {
            console.warn('Error loading known plates', err);
        }
    }

    function loadStoredIndexForSide(side) {
        const key = side === 'NORTH' ? STORAGE_KEY_NORTH : STORAGE_KEY_SOUTH;
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        const parsed = parseInt(raw, 10);
        return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
    }

    function storeIndexForSide(side, index) {
        const key = side === 'NORTH' ? STORAGE_KEY_NORTH : STORAGE_KEY_SOUTH;
        localStorage.setItem(key, String(index));
    }

    function getCurrentPeriod() {
        const hour = new Date().getHours();
        if (hour < 11) return 'MORNING';
        if (hour < 16) return 'NOON';
        return 'EVENING';
    }

    function buildSessionName(period) {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${period}-${year}-${month}-${day}`;
    }

    function updatePlateStatus(plate) {
        if (!plate) {
            plateStatusEl.textContent = '';
            return;
        }
        const upper = plate.toUpperCase();
        if (residentPlatesSet.has(upper)) {
            plateStatusEl.textContent = 'Known resident license plate';
            plateStatusEl.className = 'text-xs mt-1 h-4 text-emerald-600 font-medium';
        } else if (outsiderPlatesSet.has(upper)) {
            plateStatusEl.textContent = 'Previously seen outsider plate';
            plateStatusEl.className = 'text-xs mt-1 h-4 text-indigo-600 font-medium';
        } else {
            plateStatusEl.textContent = 'Not registered (will be treated as outsider)';
            plateStatusEl.className = 'text-xs mt-1 h-4 text-amber-600 font-medium';
        }
    }

    function formatSlotLabel(side, index) {
        return `${side}-${String(index).padStart(2, '0')}`;
    }

    function updateSlotUI() {
        if (!selectedSide) {
            slotRow.classList.add('hidden');
            return;
        }
        slotRow.classList.remove('hidden');

        const location = getCurrentLocation();
        const storedPlate = getPlateForLocation(location);

        const indicator = storedPlate ? ' \u2713' : '';
        slotLabelEl.textContent = formatSlotLabel(selectedSide, currentIndex) + indicator;

        if (storedPlate) {
            slotLabelEl.classList.remove('text-slate-800');
            slotLabelEl.classList.add('text-emerald-600');
        } else {
            slotLabelEl.classList.remove('text-emerald-600');
            slotLabelEl.classList.add('text-slate-800');
        }

        slotPrevBtn.disabled = currentIndex <= 1;
        slotNextBtn.disabled = false;

        const spotDecBtn = document.getElementById('spot-dec');
        const spotIncBtn = document.getElementById('spot-inc');
        if (spotDecBtn && spotIncBtn) {
            spotDecBtn.disabled = currentIndex <= 1;
            spotIncBtn.disabled = false;
        }

        if (storedPlate) {
            licensePlateInput.value = storedPlate;
            updatePlateStatus(storedPlate);
            showToast('Previous entry loaded', 'info', 2000);
        } else {
            if (licensePlateInput.value) {
                licensePlateInput.value = '';
                updatePlateStatus('');
            }
        }
    }

    function getCurrentLocation() {
        if (!selectedSide) return null;
        return formatSlotLabel(selectedSide, currentIndex);
    }

    function goPrevSlot() {
        if (currentIndex > 1) {
            currentIndex--;
            updateSlotUI();
        }
    }

    function goNextSlot() {
        currentIndex++;
        updateSlotUI();
        if (selectedSide) storeIndexForSide(selectedSide, currentIndex);
    }

    slotPrevBtn.addEventListener('click', () => {
        goPrevSlot();
        if (selectedSide) storeIndexForSide(selectedSide, currentIndex);
    });
    slotNextBtn.addEventListener('click', goNextSlot);

    // Spot adjustment buttons
    const spotDecBtn = document.getElementById('spot-dec');
    const spotIncBtn = document.getElementById('spot-inc');

    function updateSpotOnly() {
        if (!selectedSide) return;
        const location = getCurrentLocation();
        const storedPlate = getPlateForLocation(location);
        const indicator = storedPlate ? ' \u2713' : '';
        slotLabelEl.textContent = formatSlotLabel(selectedSide, currentIndex) + indicator;

        if (storedPlate) {
            slotLabelEl.classList.remove('text-slate-800');
            slotLabelEl.classList.add('text-emerald-600');
        } else {
            slotLabelEl.classList.remove('text-emerald-600');
            slotLabelEl.classList.add('text-slate-800');
        }

        spotDecBtn.disabled = currentIndex <= 1;
        spotIncBtn.disabled = false;
    }

    spotDecBtn.addEventListener('click', () => {
        if (currentIndex > 1) { currentIndex--; updateSpotOnly(); }
    });
    spotIncBtn.addEventListener('click', () => {
        currentIndex++;
        updateSpotOnly();
    });

    // Clear history
    document.getElementById('clear-history-btn').addEventListener('click', () => {
        if (confirm('Are you sure you want to clear all saved license plate entries? This cannot be undone.')) {
            plateHistory = {};
            savePlateHistory();
            updateSlotUI();
            showToast('History cleared', 'warning', 2500);
        }
    });

    // Change side button
    changeSideBtn.addEventListener('click', () => {
        sideOverlay.classList.add('show');
        if (selectedSide) sideSelect.value = selectedSide;
    });

    // Close side dialog
    sideCloseBtn.addEventListener('click', () => {
        sideOverlay.classList.remove('show');
    });

    // Confirm side selection
    sideConfirmBtn.addEventListener('click', () => {
        const value = sideSelect.value;
        if (!value) {
            showToast('Please select a side (North or South)', 'warning');
            return;
        }
        selectedSide = value;
        currentIndex = 1;
        storeIndexForSide(selectedSide, currentIndex);
        updateSlotUI();
        sideOverlay.classList.remove('show');
    });

    function ensureSideSelected() {
        if (!selectedSide) {
            showToast('Please select parking side first', 'warning');
            sideOverlay.classList.add('show');
            return false;
        }
        return true;
    }

    // Initialize on load
    window.addEventListener('load', loadKnownPlates);

    window.addEventListener('load', () => {
        if (!sessionInput.value.trim()) {
            sessionInput.value = buildSessionName(getCurrentPeriod());
        }

        document.querySelectorAll('.session-chip[data-period]').forEach(chip => {
            chip.addEventListener('click', () => {
                sessionInput.value = buildSessionName(chip.dataset.period);
            });
        });

        const autoBtn = document.getElementById('session-today-auto');
        if (autoBtn) {
            autoBtn.addEventListener('click', () => {
                sessionInput.value = buildSessionName(getCurrentPeriod());
            });
        }

        sessionInput.addEventListener('focus', () => {
            sessionSuggestions.classList.remove('hidden');
            sessionSuggestions.classList.add('flex');
        });

        sessionInput.addEventListener('blur', () => {
            setTimeout(() => {
                sessionSuggestions.classList.add('hidden');
                sessionSuggestions.classList.remove('flex');
            }, 150);
        });
    });

    // Plate status updates
    licensePlateInput.addEventListener('input', () => updatePlateStatus(licensePlateInput.value.trim()));
    licensePlateInput.addEventListener('focus', () => {
        setTimeout(() => submitBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
    });
    licensePlateInput.addEventListener('awesomplete-selectcomplete', (e) => {
        const selected = e.text && e.text.value ? e.text.value : licensePlateInput.value.trim();
        updatePlateStatus(selected);
    });
    licensePlateInput.addEventListener('change', () => updatePlateStatus(licensePlateInput.value.trim()));

    // Form submit
    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!ensureSideSelected()) return;

        const sessionName = sessionInput.value.trim();
        const licensePlate = licensePlateInput.value.trim().toUpperCase();
        const noParking = !!noParkingCheckbox.checked;

        updatePlateStatus(licensePlate);

        if (!licensePlate) {
            showToast('Please fill in license plate', 'warning');
            return;
        }

        const locationValue = getCurrentLocation();
        if (!locationValue && !noParking) {
            showToast('Location is not ready. Please select side again.', 'error');
            return;
        }

        setBtnLoading(submitBtn, true, 'Sending...');

        try {
            const body = {
                licensePlate,
                location: locationValue,
                sessionName: sessionName || null,
                noParking
            };

            const response = await fetch('/scan-entries', {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            });

            if (response.ok) {
                if (locationValue) storePlateForLocation(locationValue, licensePlate);

                showToast('Saved successfully', 'success');
                licensePlateInput.value = '';
                updatePlateStatus('');
                noParkingCheckbox.checked = false;

                if (selectedSide) storeIndexForSide(selectedSide, currentIndex);
                if (!noParking) goNextSlot();
            } else {
                showToast('Error: ' + response.status, 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            setBtnLoading(submitBtn, false, 'Submit');
        }
    });
</script>

</body>
</html>
