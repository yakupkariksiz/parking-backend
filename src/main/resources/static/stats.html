<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Session Stats – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

<!-- Main content -->
<main class="max-w-2xl mx-auto px-4 sm:px-6 pt-8 pb-16 page-fade-in">

    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800">Session Stats</h1>
        <p class="text-sm text-slate-500 mt-1">Select a <strong>scan session</strong> to see resident vs non-resident breakdowns.</p>
    </div>

    <!-- Session selector card -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6 mb-6">
        <form id="stats-form" class="space-y-4">
            <div>
                <label for="session" class="block text-sm font-semibold text-slate-700 mb-1.5">Scan session</label>
                <select id="session" name="session" required class="form-select">
                    <option value="">Loading sessions...</option>
                </select>
            </div>
            <div class="flex gap-3">
                <button type="submit" id="submit-btn" class="btn-primary flex-1 btn-press">Show stats</button>
                <button type="button" id="delete-btn" class="btn-danger btn-press">Remove session</button>
            </div>
        </form>
    </div>

    <!-- Stats card (hidden by default) -->
    <div id="stats-card" class="hidden">
        <!-- Summary stats -->
        <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6 mb-4">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-center">
                <div class="bg-slate-50 rounded-lg p-3">
                    <div class="text-lg font-bold text-slate-800" id="stats-session-name">-</div>
                    <div class="text-xs text-slate-500 mt-0.5 font-medium">Session</div>
                </div>
                <div class="bg-slate-50 rounded-lg p-3">
                    <div class="text-lg font-bold text-indigo-600" id="stats-total">-</div>
                    <div class="text-xs text-slate-500 mt-0.5 font-medium">Total Scans</div>
                </div>
                <div class="bg-emerald-50 rounded-lg p-3">
                    <div class="text-lg font-bold text-emerald-600"><span id="stats-resident-count">-</span> <span class="text-sm font-normal text-emerald-500">(<span id="stats-resident-pct">-</span>%)</span></div>
                    <div class="text-xs text-emerald-600/70 mt-0.5 font-medium">Residents</div>
                </div>
                <div class="bg-amber-50 rounded-lg p-3">
                    <div class="text-lg font-bold text-amber-600"><span id="stats-nonresident-count">-</span> <span class="text-sm font-normal text-amber-500">(<span id="stats-nonresident-pct">-</span>%)</span></div>
                    <div class="text-xs text-amber-600/70 mt-0.5 font-medium">Non-residents</div>
                </div>
            </div>
        </div>

        <!-- Entries table -->
        <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
            <div class="px-5 sm:px-6 py-3 border-b border-slate-100">
                <h3 class="text-sm font-semibold text-slate-700">Entries</h3>
            </div>
            <div class="max-h-80 overflow-auto">
                <table class="data-table" id="entries-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Plate</th>
                            <th>Type</th>
                            <th>Location</th>
                        </tr>
                    </thead>
                    <tbody id="entries-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="/common.js"></script>
<script>
    requireAuth();
    renderNavDrawer('stats');
    loadCurrentUser();

    const sessionSelect = document.getElementById('session');
    const form = document.getElementById('stats-form');
    const submitBtn = document.getElementById('submit-btn');
    const deleteBtn = document.getElementById('delete-btn');

    const statsCard = document.getElementById('stats-card');
    const statsSessionName = document.getElementById('stats-session-name');
    const statsTotal = document.getElementById('stats-total');
    const statsResidentCount = document.getElementById('stats-resident-count');
    const statsResidentPct = document.getElementById('stats-resident-pct');
    const statsNonResidentCount = document.getElementById('stats-nonresident-count');
    const statsNonResidentPct = document.getElementById('stats-nonresident-pct');
    const entriesTbody = document.getElementById('entries-tbody');

    async function loadSessions() {
        try {
            const response = await fetch('/scan-sessions', { headers: getAuthHeaders() });
            if (!checkAuth(response)) return;
            if (!response.ok) {
                sessionSelect.innerHTML = '<option value="">Failed to load sessions</option>';
                return;
            }
            const sessions = await response.json();
            if (sessions.length === 0) {
                sessionSelect.innerHTML = '<option value="">No sessions yet</option>';
                return;
            }

            sessionSelect.innerHTML = '<option value="">Select a session</option>';
            sessions.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = s.name + ' (' + s.createdAt + ')';
                sessionSelect.appendChild(option);
            });
        } catch (err) {
            sessionSelect.innerHTML = '<option value="">Error loading sessions</option>';
        }
    }

    loadSessions();

    deleteBtn.addEventListener('click', async () => {
        statsCard.classList.add('hidden');
        const sessionId = sessionSelect.value;
        if (!sessionId) {
            showToast('Please select a session to remove', 'warning');
            return;
        }
        if (!confirm('Are you sure you want to remove this session and its stats?')) return;

        setBtnLoading(deleteBtn, true, 'Removing...');
        try {
            const response = await fetch(`/scan-sessions/${encodeURIComponent(sessionId)}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            if (!response.ok) {
                showToast('Error removing session: ' + response.status, 'error');
                return;
            }
            showToast('Session removed', 'success');
            await loadSessions();
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            setBtnLoading(deleteBtn, false, 'Remove session');
        }
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        statsCard.classList.add('hidden');
        entriesTbody.innerHTML = '';

        const sessionId = sessionSelect.value;
        if (!sessionId) {
            showToast('Please select a session', 'warning');
            return;
        }

        setBtnLoading(submitBtn, true, 'Loading...');

        try {
            const response = await fetch(`/stats/session/${encodeURIComponent(sessionId)}`, { headers: getAuthHeaders() });
            if (!checkAuth(response)) return;
            if (!response.ok) {
                showToast('Error: ' + response.status, 'error');
                return;
            }

            const data = await response.json();

            if (data.totalCount === 0) {
                showToast('No scans found for this session', 'info');
                return;
            }

            statsSessionName.textContent = data.sessionName;
            statsTotal.textContent = data.totalCount;
            statsResidentCount.textContent = data.residentCount;
            statsResidentPct.textContent = data.residentPercentage.toFixed(1);
            statsNonResidentCount.textContent = data.nonResidentCount;
            statsNonResidentPct.textContent = data.nonResidentPercentage.toFixed(1);

            // Populate entries table
            if (Array.isArray(data.entries)) {
                data.entries.forEach(entry => {
                    const tr = document.createElement('tr');

                    const timeTd = document.createElement('td');
                    timeTd.className = 'text-xs text-slate-500';
                    timeTd.textContent = entry.createdAt || '';

                    const plateTd = document.createElement('td');
                    plateTd.innerHTML = `<span class="font-mono text-xs font-semibold">${entry.licensePlate || ''}</span>`;

                    const typeTd = document.createElement('td');
                    if (entry.resident) {
                        typeTd.innerHTML = '<span class="badge badge-enabled">Resident</span>';
                    } else {
                        typeTd.innerHTML = '<span class="badge badge-pending">Outsider</span>';
                    }

                    const locationTd = document.createElement('td');
                    locationTd.className = 'text-xs text-slate-500 font-mono';
                    locationTd.textContent = entry.location || '';

                    tr.appendChild(timeTd);
                    tr.appendChild(plateTd);
                    tr.appendChild(typeTd);
                    tr.appendChild(locationTd);
                    entriesTbody.appendChild(tr);
                });
            }

            statsCard.classList.remove('hidden');
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            setBtnLoading(submitBtn, false, 'Show stats');
        }
    });
</script>

</body>
</html>
