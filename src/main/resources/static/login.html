<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 1rem;
            color: #1e293b;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }
        .login-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 16px;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
        }
        .message.error {
            color: #b91c1c;
            background: #fef2f2;
        }
        .message.info {
            color: #15803d;
            background: #f0fdf4;
        }
        .toggle-link {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }
        .toggle-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        .toggle-link a:hover {
            text-decoration: underline;
        }
        .hidden {
            display: none;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">&#128663;</div>
    <h1>Parking Scanner</h1>
    <div class="subtitle">
        Sign in to manage parking and scan plates
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>

    <div class="toggle-link" id="showSignup">
        Don't have an account? <a onclick="toggleForms('signup')">Sign Up</a>
    </div>

    <!-- Sign Up Form (hidden by default) -->
    <form id="signupForm" class="hidden">
        <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="your.email@example.com" required>
        </div>
        <button type="submit" class="login-btn" id="signupBtn" style="background: #10b981;">Request Access</button>
    </form>

    <div class="toggle-link hidden" id="showLogin">
        Already have an account? <a onclick="toggleForms('login')">Sign In</a>
    </div>

    <div id="msg" class="message" style="display:none;"></div>

    <div class="footer">
        Parking Management System
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const msgEl = document.getElementById('msg');

    if (params.has('logout')) {
        msgEl.textContent = 'You have been logged out successfully.';
        msgEl.classList.add('info');
        msgEl.style.display = 'block';
    } else if (params.has('expired')) {
        msgEl.textContent = 'Your session has expired. Please sign in again.';
        msgEl.classList.add('error');
        msgEl.style.display = 'block';
    }

    // If already logged in, redirect to dashboard
    if (localStorage.getItem('jwt_token')) {
        window.location.href = '/dashboard.html';
    }

    // Toggle between login and signup forms
    function toggleForms(mode) {
        msgEl.style.display = 'none';
        msgEl.className = 'message';
        if (mode === 'signup') {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('showSignup').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('showLogin').classList.remove('hidden');
            document.querySelector('.subtitle').textContent = 'Request access to the parking system';
        } else {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('showSignup').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('showLogin').classList.add('hidden');
            document.querySelector('.subtitle').textContent = 'Sign in to manage parking and scan plates';
        }
    }

    // Login form handler
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.style.display = 'none';

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('jwt_token', data.token);
                localStorage.setItem('jwt_username', data.username);
                localStorage.setItem('jwt_role', data.role);
                window.location.href = '/dashboard.html';
            } else {
                msgEl.textContent = data.error || 'Authentication failed. Please try again.';
                msgEl.classList.remove('info');
                msgEl.classList.add('error');
                msgEl.style.display = 'block';
            }
        } catch (err) {
            msgEl.textContent = 'Connection error. Please try again.';
            msgEl.classList.remove('info');
            msgEl.classList.add('error');
            msgEl.style.display = 'block';
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign In';
        }
    });

    // Signup form handler
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.style.display = 'none';

        const signupBtn = document.getElementById('signupBtn');
        signupBtn.disabled = true;
        signupBtn.textContent = 'Submitting...';

        const email = document.getElementById('signupEmail').value.trim();

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok) {
                msgEl.textContent = data.message || 'Request submitted! An administrator will review your request.';
                msgEl.classList.remove('error');
                msgEl.classList.add('info');
                msgEl.style.display = 'block';
                document.getElementById('signupForm').reset();
            } else {
                msgEl.textContent = data.error || 'Failed to submit request.';
                msgEl.classList.remove('info');
                msgEl.classList.add('error');
                msgEl.style.display = 'block';
            }
        } catch (err) {
            msgEl.textContent = 'Connection error. Please try again.';
            msgEl.classList.remove('info');
            msgEl.classList.add('error');
            msgEl.style.display = 'block';
        } finally {
            signupBtn.disabled = false;
            signupBtn.textContent = 'Request Access';
        }
    });
</script>
</body>
</html>
