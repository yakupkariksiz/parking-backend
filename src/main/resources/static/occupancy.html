<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Occupancy Chart – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <link rel="stylesheet" href="/common.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

<script src="/common.js"></script>
<script>
    requireAuth();
    renderNavDrawer('occupancy');
</script>

<!-- Main content -->
<main class="max-w-6xl mx-auto px-4 sm:px-6 pt-8 pb-16 page-fade-in">

    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800">Parking Occupancy Chart</h1>
        <p class="text-sm text-slate-500 mt-1">Visualize parking usage: Residents vs Non-Residents compared to capacity (96 spots)</p>
    </div>

    <!-- Controls -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6 mb-6">
        <div class="flex flex-wrap items-end gap-4">
            <div>
                <label for="startDate" class="block text-xs font-semibold text-slate-500 mb-1">Start Date</label>
                <input type="date" id="startDate" class="form-input text-sm py-2 px-3">
            </div>
            <div>
                <label for="endDate" class="block text-xs font-semibold text-slate-500 mb-1">End Date</label>
                <input type="date" id="endDate" class="form-input text-sm py-2 px-3">
            </div>
            <div class="flex gap-1.5 flex-wrap">
                <button class="quick-btn px-3 py-2 rounded-lg border border-slate-200 bg-indigo-600 text-white text-xs font-medium cursor-pointer transition-all hover:bg-indigo-700" data-days="7">Last 7 days</button>
                <button class="quick-btn px-3 py-2 rounded-lg border border-slate-200 bg-white text-slate-600 text-xs font-medium cursor-pointer transition-all hover:bg-slate-50" data-days="14">Last 14 days</button>
                <button class="quick-btn px-3 py-2 rounded-lg border border-slate-200 bg-white text-slate-600 text-xs font-medium cursor-pointer transition-all hover:bg-slate-50" data-days="30">Last 30 days</button>
            </div>
            <button id="refresh-btn" class="btn-primary btn-press text-sm py-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Refresh
            </button>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">
        <div class="bg-white rounded-xl border border-slate-200/80 p-4 text-center">
            <div class="text-2xl font-bold text-slate-800" id="total-scans">-</div>
            <div class="text-xs text-slate-500 mt-1 font-medium">Total Scans</div>
        </div>
        <div class="bg-white rounded-xl border border-indigo-200/80 p-4 text-center">
            <div class="text-2xl font-bold text-indigo-600" id="total-residents">-</div>
            <div class="text-xs text-slate-500 mt-1 font-medium">Residents</div>
        </div>
        <div class="bg-white rounded-xl border border-rose-200/80 p-4 text-center">
            <div class="text-2xl font-bold text-rose-600" id="total-non-residents">-</div>
            <div class="text-xs text-slate-500 mt-1 font-medium">Non-Residents</div>
        </div>
        <div class="bg-white rounded-xl border border-emerald-200/80 p-4 text-center">
            <div class="text-2xl font-bold text-emerald-600" id="avg-occupancy">-</div>
            <div class="text-xs text-slate-500 mt-1 font-medium">Avg Occupancy %</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200/80 p-4 text-center" id="over-capacity-card">
            <div class="text-2xl font-bold text-slate-800" id="over-capacity-days">-</div>
            <div class="text-xs text-slate-500 mt-1 font-medium">Days Over Capacity</div>
        </div>
    </div>

    <!-- Legend -->
    <div class="flex justify-center gap-6 mb-4 text-sm">
        <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#6366f1]"></div>
            <span class="text-slate-600">Residents</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-4 h-4 rounded bg-[#f43f5e]"></div>
            <span class="text-slate-600">Non-Residents</span>
        </div>
        <div class="flex items-center gap-2">
            <div class="w-6 h-0.5 bg-emerald-500 rounded"></div>
            <span class="text-slate-600">Capacity (96)</span>
        </div>
    </div>

    <!-- Chart -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6">
        <div class="relative h-[400px]">
            <canvas id="occupancyChart"></canvas>
        </div>
    </div>

</main>

<script>
    loadCurrentUser();

    // Date controls
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const quickBtns = document.querySelectorAll('.quick-btn');
    const refreshBtn = document.getElementById('refresh-btn');

    function setDateRange(days) {
        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - days + 1);
        endDateInput.value = end.toISOString().split('T')[0];
        startDateInput.value = start.toISOString().split('T')[0];
    }

    setDateRange(7);

    quickBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            quickBtns.forEach(b => {
                b.classList.remove('bg-indigo-600', 'text-white', 'hover:bg-indigo-700');
                b.classList.add('bg-white', 'text-slate-600', 'hover:bg-slate-50');
            });
            btn.classList.remove('bg-white', 'text-slate-600', 'hover:bg-slate-50');
            btn.classList.add('bg-indigo-600', 'text-white', 'hover:bg-indigo-700');
            setDateRange(parseInt(btn.dataset.days));
            loadChartData();
        });
    });

    refreshBtn.addEventListener('click', loadChartData);

    let occupancyChart = null;

    async function loadChartData() {
        const startDate = startDateInput.value;
        const endDate = endDateInput.value;

        try {
            const res = await fetch(`/stats/occupancy?startDate=${startDate}&endDate=${endDate}`, { headers: getAuthHeaders() });
            if (!checkAuth(res)) return;
            if (!res.ok) throw new Error('Failed to load data');

            const data = await res.json();
            renderChart(data);
            updateSummary(data);
        } catch (err) {
            showToast('Error loading chart data: ' + err.message, 'error');
        }
    }

    function renderChart(data) {
        const ctx = document.getElementById('occupancyChart').getContext('2d');

        const labels = [...data.dataPoints.map(d => d.label), 'Average'];
        const residentsData = [...data.dataPoints.map(d => d.residentCount), data.average.residentCount];
        const nonResidentsData = [...data.dataPoints.map(d => d.nonResidentCount), data.average.nonResidentCount];

        if (occupancyChart) occupancyChart.destroy();

        occupancyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Residents',
                        data: residentsData,
                        backgroundColor: '#6366f1',
                        borderRadius: 4,
                        borderSkipped: false,
                    },
                    {
                        label: 'Non-Residents',
                        data: nonResidentsData,
                        backgroundColor: '#f43f5e',
                        borderRadius: 4,
                        borderSkipped: false,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true,
                        grid: { display: false }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        max: Math.max(data.capacity + 20, ...data.dataPoints.map(d => d.totalCount + 10)),
                        grid: { color: '#f1f5f9' },
                        title: { display: true, text: 'Number of Cars', color: '#64748b', font: { size: 12 } }
                    }
                },
                plugins: {
                    annotation: {
                        annotations: {
                            capacityLine: {
                                type: 'line',
                                yMin: data.capacity,
                                yMax: data.capacity,
                                borderColor: '#10b981',
                                borderWidth: 2.5,
                                borderDash: [6, 6],
                                label: {
                                    display: true,
                                    content: `Capacity: ${data.capacity}`,
                                    position: 'end',
                                    backgroundColor: '#10b981',
                                    color: 'white',
                                    font: { size: 11, weight: 'bold' }
                                }
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: '#1e293b',
                        titleColor: '#f8fafc',
                        bodyColor: '#cbd5e1',
                        borderColor: '#334155',
                        borderWidth: 1,
                        cornerRadius: 8,
                        padding: 12,
                        callbacks: {
                            afterBody: function(context) {
                                const dataIndex = context[0].dataIndex;
                                let total, occupancyPct, isOverCapacity;

                                if (dataIndex < data.dataPoints.length) {
                                    const point = data.dataPoints[dataIndex];
                                    total = point.totalCount;
                                    occupancyPct = point.occupancyPercentage.toFixed(1);
                                    isOverCapacity = point.overCapacity;
                                } else {
                                    total = data.average.totalCount;
                                    occupancyPct = data.average.occupancyPercentage.toFixed(1);
                                    isOverCapacity = data.average.overCapacity;
                                }

                                let lines = ['', `Total: ${total}`, `Occupancy: ${occupancyPct}%`];
                                if (isOverCapacity) lines.push('OVER CAPACITY');
                                return lines;
                            }
                        }
                    },
                    legend: { display: false }
                }
            }
        });
    }

    function updateSummary(data) {
        const totalScans = data.dataPoints.reduce((sum, d) => sum + d.totalCount, 0);
        const totalResidents = data.dataPoints.reduce((sum, d) => sum + d.residentCount, 0);
        const totalNonResidents = data.dataPoints.reduce((sum, d) => sum + d.nonResidentCount, 0);
        const avgOccupancy = data.average.occupancyPercentage.toFixed(1);
        const overCapacityDays = data.dataPoints.filter(d => d.overCapacity).length;

        document.getElementById('total-scans').textContent = totalScans;
        document.getElementById('total-residents').textContent = totalResidents;
        document.getElementById('total-non-residents').textContent = totalNonResidents;
        document.getElementById('avg-occupancy').textContent = avgOccupancy + '%';
        document.getElementById('over-capacity-days').textContent = overCapacityDays;

        const overCard = document.getElementById('over-capacity-card');
        const overValue = document.getElementById('over-capacity-days');
        if (overCapacityDays > 0) {
            overCard.classList.remove('border-slate-200/80');
            overCard.classList.add('border-rose-200/80');
            overValue.classList.remove('text-slate-800');
            overValue.classList.add('text-rose-600');
        } else {
            overCard.classList.add('border-slate-200/80');
            overCard.classList.remove('border-rose-200/80');
            overValue.classList.add('text-slate-800');
            overValue.classList.remove('text-rose-600');
        }
    }

    // Initial load
    loadChartData();
</script>

</body>
</html>
