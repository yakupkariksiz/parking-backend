<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set Password – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            padding: 40px 32px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: #1e293b;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 32px;
        }
        .email-display {
            background: #f0fdf4;
            color: #15803d;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-size: 1rem;
            color: #1e293b;
            background: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: white;
        }
        .form-group .hint {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 8px;
            border: none;
            background: #10b981;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover {
            background: #059669;
            transform: translateY(-1px);
        }
        .submit-btn:active {
            transform: translateY(0);
        }
        .submit-btn:disabled {
            background: #6ee7b7;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 16px;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
        }
        .message.error {
            color: #b91c1c;
            background: #fef2f2;
        }
        .message.info {
            color: #15803d;
            background: #f0fdf4;
        }
        .login-link {
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .loading {
            color: #64748b;
            font-size: 1rem;
            padding: 40px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">&#128663;</div>
    <h1>Set Your Password</h1>

    <!-- Loading state -->
    <div id="loadingState" class="loading">
        Validating your link...
    </div>

    <!-- Error state (invalid/expired token) -->
    <div id="errorState" style="display:none;">
        <div class="subtitle" id="errorText">This link is invalid or has expired.</div>
        <div class="login-link">
            <a href="/login.html">Back to Login</a>
        </div>
    </div>

    <!-- Form state (valid token) -->
    <div id="formState" style="display:none;">
        <div class="subtitle">Choose your username and password to complete registration</div>

        <div class="email-display" id="emailDisplay"></div>

        <form id="setPasswordForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autofocus minlength="3" maxlength="64">
                <div class="hint">3-64 characters, must be unique</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6">
                <div class="hint">At least 6 characters</div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
        </form>

        <div id="msg" class="message" style="display:none;"></div>
    </div>

    <!-- Success state -->
    <div id="successState" style="display:none;">
        <div class="subtitle" style="color: #15803d;">
            Your account has been created successfully!
        </div>
        <div class="login-link" style="margin-top: 24px;">
            <a href="/login.html" class="submit-btn" style="display: inline-block; text-decoration: none; padding: 12px 32px;">Go to Login</a>
        </div>
    </div>

    <div class="footer">
        Parking Management System
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const formState = document.getElementById('formState');
    const successState = document.getElementById('successState');
    const msgEl = document.getElementById('msg');

    // Validate token on page load
    async function validateToken() {
        if (!token) {
            showError('No token provided. Please use the link from your email.');
            return;
        }

        try {
            const res = await fetch('/api/auth/validate-token?token=' + encodeURIComponent(token));
            const data = await res.json();

            if (res.ok && data.valid) {
                loadingState.style.display = 'none';
                formState.style.display = 'block';
                document.getElementById('emailDisplay').textContent = data.email;
            } else {
                showError(data.error || 'This link is invalid or has expired.');
            }
        } catch (err) {
            showError('Connection error. Please try again.');
        }
    }

    function showError(text) {
        loadingState.style.display = 'none';
        document.getElementById('errorText').textContent = text;
        errorState.style.display = 'block';
    }

    // Form submission
    document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        msgEl.style.display = 'none';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            msgEl.textContent = 'Passwords do not match.';
            msgEl.classList.remove('info');
            msgEl.classList.add('error');
            msgEl.style.display = 'block';
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating account...';

        try {
            const res = await fetch('/api/auth/set-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, username, password })
            });

            const data = await res.json();

            if (res.ok) {
                formState.style.display = 'none';
                successState.style.display = 'block';
            } else {
                msgEl.textContent = data.error || 'Failed to create account.';
                msgEl.classList.remove('info');
                msgEl.classList.add('error');
                msgEl.style.display = 'block';
            }
        } catch (err) {
            msgEl.textContent = 'Connection error. Please try again.';
            msgEl.classList.remove('info');
            msgEl.classList.add('error');
            msgEl.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create Account';
        }
    });

    validateToken();
</script>
</body>
</html>
