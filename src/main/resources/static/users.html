<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

<script src="/common.js"></script>
<script>
    requireAuth();
    requireAdmin();
    renderNavDrawer('users');
</script>

<!-- Edit User Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-panel">
        <h3 class="text-lg font-semibold text-slate-800 mb-5">Edit User</h3>
        <form id="editUserForm" class="space-y-3.5">
            <input type="hidden" id="editId">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Username</label>
                <input type="text" id="editUsername" disabled class="form-input bg-slate-100 text-slate-500 cursor-not-allowed">
            </div>
            <div>
                <label for="editEmail" class="block text-xs font-semibold text-slate-500 mb-1">Email</label>
                <input type="email" id="editEmail" class="form-input">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label for="editRole" class="block text-xs font-semibold text-slate-500 mb-1">Role</label>
                    <select id="editRole" class="form-select">
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>
                <div>
                    <label for="editEnabled" class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                    <select id="editEnabled" class="form-select">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>
            <div>
                <label for="editPassword" class="block text-xs font-semibold text-slate-500 mb-1">New Password <span class="text-slate-400 font-normal">(blank = keep current)</span></label>
                <input type="password" id="editPassword" class="form-input" placeholder="Leave blank to keep">
            </div>
            <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" class="btn-secondary btn-press" onclick="closeEditModal()">Cancel</button>
                <button type="submit" class="btn-primary btn-press">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<!-- Main content -->
<main class="max-w-4xl mx-auto px-4 sm:px-6 pt-8 pb-16 page-fade-in">

    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-800">User Management</h1>
    </div>

    <!-- Pending Registration Requests -->
    <div id="pendingSection" class="bg-white rounded-xl border border-amber-200 overflow-hidden mb-6 hidden">
        <div class="px-5 sm:px-6 py-4 border-b border-amber-100 bg-amber-50/50 flex items-center gap-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <h2 class="text-base font-semibold text-slate-800">Pending Registration Requests</h2>
            <span class="badge badge-pending" id="pendingCount">0</span>
        </div>
        <div id="pendingContainer" class="p-5 sm:p-6">
            <div class="text-sm text-slate-400 text-center py-4">Loading...</div>
        </div>
    </div>

    <!-- Add User Form -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6 mb-6">
        <h2 class="text-base font-semibold text-slate-800 mb-4">Add New User</h2>
        <form id="addUserForm" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="newUsername" class="block text-xs font-semibold text-slate-500 mb-1">Username</label>
                    <input type="text" id="newUsername" required class="form-input">
                </div>
                <div>
                    <label for="newPassword" class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
                    <input type="password" id="newPassword" required class="form-input">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="newEmail" class="block text-xs font-semibold text-slate-500 mb-1">Email <span class="text-slate-400 font-normal">(optional)</span></label>
                    <input type="email" id="newEmail" class="form-input">
                </div>
                <div>
                    <label for="newRole" class="block text-xs font-semibold text-slate-500 mb-1">Role</label>
                    <select id="newRole" class="form-select">
                        <option value="ROLE_USER">User</option>
                        <option value="ROLE_ADMIN">Admin</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="addBtn" class="btn-primary btn-press">Add User</button>
        </form>
    </div>

    <!-- Users Table -->
    <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
        <div class="px-5 sm:px-6 py-4 border-b border-slate-100">
            <h2 class="text-base font-semibold text-slate-800">All Users</h2>
        </div>
        <div id="usersContainer" class="p-5 sm:p-6">
            <div class="flex items-center justify-center gap-3 py-8 text-slate-400">
                <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <span class="text-sm">Loading users...</span>
            </div>
        </div>
    </div>

</main>

<script>
    loadCurrentUser();

    const usersContainer = document.getElementById('usersContainer');

    // Load users
    async function loadUsers() {
        showSpinner(usersContainer, 'Loading users...');
        try {
            const res = await fetch('/api/admin/users', { headers: getAuthHeaders() });
            if (!checkAuth(res)) return;
            if (!res.ok) {
                usersContainer.innerHTML = `<p class="text-sm text-rose-500 text-center py-4">Error loading users: ${res.status}</p>`;
                return;
            }
            renderUsers(await res.json());
        } catch (err) {
            usersContainer.innerHTML = `<p class="text-sm text-rose-500 text-center py-4">Network error: ${err.message}</p>`;
        }
    }

    function renderUsers(users) {
        if (users.length === 0) {
            usersContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">No users found.</p>';
            return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'overflow-x-auto -mx-5 sm:-mx-6';

        const table = document.createElement('table');
        table.className = 'data-table';
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
        `;

        const tbody = document.createElement('tbody');
        users.forEach(u => {
            const tr = document.createElement('tr');
            const roleBadge = u.role === 'ROLE_ADMIN'
                ? '<span class="badge badge-admin">Admin</span>'
                : '<span class="badge badge-user">User</span>';
            const statusBadge = u.enabled
                ? '<span class="badge badge-enabled">Enabled</span>'
                : '<span class="badge badge-disabled">Disabled</span>';

            tr.innerHTML = `
                <td><span class="font-semibold text-slate-800">${u.username}</span></td>
                <td class="text-slate-500">${u.email || '<span class="text-slate-300">-</span>'}</td>
                <td>${roleBadge}</td>
                <td>${statusBadge}</td>
                <td class="whitespace-nowrap"></td>
            `;

            // Build action buttons with proper event listeners (avoids inline onclick with string escaping issues)
            const tdActions = tr.querySelector('td:last-child');

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-ghost text-xs text-indigo-600 hover:text-indigo-800';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', () => openEditModal(u.id, u.username, u.email || '', u.role, u.enabled));
            tdActions.appendChild(editBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-ghost text-xs text-rose-600 hover:text-rose-800';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', () => deleteUser(u.id, u.username));
            tdActions.appendChild(deleteBtn);

            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrapper.appendChild(table);

        usersContainer.innerHTML = '';
        usersContainer.appendChild(wrapper);
    }

    // Add user
    document.getElementById('addUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const addBtn = document.getElementById('addBtn');
        setBtnLoading(addBtn, true, 'Adding...');

        const body = {
            username: document.getElementById('newUsername').value.trim(),
            password: document.getElementById('newPassword').value,
            email: document.getElementById('newEmail').value.trim() || null,
            role: document.getElementById('newRole').value
        };

        try {
            const res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                showToast('User created successfully', 'success');
                document.getElementById('addUserForm').reset();
                await loadUsers();
            } else {
                showToast(data.error || 'Failed to create user', 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            setBtnLoading(addBtn, false, 'Add User');
        }
    });

    // Edit modal
    function openEditModal(id, username, email, role, enabled) {
        document.getElementById('editId').value = id;
        document.getElementById('editUsername').value = username;
        document.getElementById('editEmail').value = email;
        document.getElementById('editRole').value = role;
        document.getElementById('editPassword').value = '';
        document.getElementById('editEnabled').value = String(enabled);
        document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    document.getElementById('editModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('editModal')) closeEditModal();
    });

    document.getElementById('editUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const body = {
            email: document.getElementById('editEmail').value.trim() || null,
            role: document.getElementById('editRole').value,
            enabled: document.getElementById('editEnabled').value === 'true'
        };
        const newPassword = document.getElementById('editPassword').value;
        if (newPassword) body.password = newPassword;

        try {
            const res = await fetch(`/api/admin/users/${id}`, {
                method: 'PUT',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                showToast('User updated successfully', 'success');
                closeEditModal();
                await loadUsers();
            } else {
                showToast(data.error || 'Failed to update user', 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        }
    });

    // Delete user
    async function deleteUser(id, username) {
        if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;

        try {
            const res = await fetch(`/api/admin/users/${id}`, {
                method: 'DELETE',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok) {
                showToast('User deleted', 'success');
                await loadUsers();
            } else {
                showToast(data.error || 'Failed to delete user', 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        }
    }

    // --- Pending Registration Requests ---
    const pendingSection = document.getElementById('pendingSection');
    const pendingContainer = document.getElementById('pendingContainer');
    const pendingCountEl = document.getElementById('pendingCount');

    async function loadPendingRequests() {
        try {
            const res = await fetch('/api/admin/registrations', { headers: getAuthHeaders() });
            if (!checkAuth(res)) return;
            if (!res.ok) {
                pendingContainer.innerHTML = '<p class="text-sm text-rose-500 text-center py-4">Error loading requests</p>';
                return;
            }
            const requests = await res.json();
            const pending = requests.filter(r => r.status === 'PENDING');

            if (requests.length === 0) {
                pendingSection.classList.add('hidden');
                return;
            }

            pendingSection.classList.remove('hidden');
            pendingCountEl.textContent = pending.length;
            renderPendingRequests(requests);
        } catch (err) {
            console.warn('Failed to load pending requests', err);
        }
    }

    function renderPendingRequests(requests) {
        if (requests.length === 0) {
            pendingContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No registration requests.</p>';
            return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'overflow-x-auto -mx-5 sm:-mx-6';

        const table = document.createElement('table');
        table.className = 'data-table';
        table.innerHTML = `
            <thead>
                <tr>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Requested</th>
                    <th>Actions</th>
                </tr>
            </thead>
        `;

        const tbody = document.createElement('tbody');
        requests.forEach(r => {
            const tr = document.createElement('tr');
            const statusClass = r.status.toLowerCase();
            const date = new Date(r.createdAt).toLocaleDateString('en-US', {
                month: 'short', day: 'numeric', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            tr.innerHTML = `
                <td><span class="font-semibold text-slate-800">${r.email}</span></td>
                <td><span class="badge badge-${statusClass}">${r.status}</span></td>
                <td class="text-xs text-slate-500">${date}</td>
                <td class="whitespace-nowrap"></td>
            `;

            const tdActions = tr.querySelector('td:last-child');

            if (r.status === 'PENDING') {
                const roleSelect = document.createElement('select');
                roleSelect.className = 'form-select text-xs py-1 px-2 w-auto inline-block mr-1.5';
                roleSelect.id = 'role-' + r.id;
                roleSelect.innerHTML = '<option value="ROLE_USER">User</option><option value="ROLE_ADMIN">Admin</option>';
                tdActions.appendChild(roleSelect);

                const approveBtn = document.createElement('button');
                approveBtn.className = 'btn-ghost text-xs text-emerald-600 hover:text-emerald-800 font-semibold';
                approveBtn.textContent = 'Approve';
                approveBtn.addEventListener('click', () => approveRequest(r.id));
                tdActions.appendChild(approveBtn);

                const rejectBtn = document.createElement('button');
                rejectBtn.className = 'btn-ghost text-xs text-rose-600 hover:text-rose-800 font-semibold';
                rejectBtn.textContent = 'Reject';
                rejectBtn.addEventListener('click', () => rejectRequest(r.id));
                tdActions.appendChild(rejectBtn);
            } else if (r.status === 'APPROVED') {
                const roleName = r.approvedRole === 'ROLE_ADMIN' ? 'Admin' : 'User';
                tdActions.innerHTML = `<span class="text-xs text-slate-400">Approved as ${roleName}</span>`;
            } else {
                tdActions.innerHTML = '<span class="text-xs text-slate-400">-</span>';
            }

            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        wrapper.appendChild(table);

        pendingContainer.innerHTML = '';
        pendingContainer.appendChild(wrapper);
    }

    async function approveRequest(id) {
        const role = document.getElementById('role-' + id).value;
        try {
            const res = await fetch(`/api/admin/registrations/${id}/approve`, {
                method: 'PUT',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ role })
            });
            const data = await res.json();
            if (res.ok) {
                showToast('Registration approved and email sent', 'success');
                await loadPendingRequests();
            } else {
                showToast(data.error || 'Failed to approve', 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        }
    }

    async function rejectRequest(id) {
        if (!confirm('Reject this registration request?')) return;
        try {
            const res = await fetch(`/api/admin/registrations/${id}/reject`, {
                method: 'PUT',
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok) {
                showToast('Registration rejected', 'success');
                await loadPendingRequests();
            } else {
                showToast(data.error || 'Failed to reject', 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        }
    }

    loadPendingRequests();
    loadUsers();
</script>

</body>
</html>
