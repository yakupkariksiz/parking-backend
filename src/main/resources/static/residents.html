<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Residents – Parking Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/common.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

<!-- Main content -->
<main class="max-w-4xl mx-auto px-4 sm:px-6 pt-8 pb-16 page-fade-in">

    <!-- Page header -->
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-slate-800">Residents</h1>
        <p class="text-sm text-slate-500 mt-1">Map resident <strong>unique codes</strong> to one or more <strong>license plates</strong>.</p>
    </div>

    <!-- Add/edit form -->
    <div class="bg-white rounded-xl border border-slate-200/80 p-5 sm:p-6 mb-6">
        <form id="resident-form" class="space-y-4">
            <div>
                <label for="uniqueCode" class="block text-sm font-semibold text-slate-700 mb-1.5">Resident unique code</label>
                <input type="text" id="uniqueCode" name="uniqueCode" placeholder="RES-001" required class="form-input" />
            </div>
            <div>
                <label for="plates" class="block text-sm font-semibold text-slate-700 mb-1.5">License plates (comma or newline separated)</label>
                <textarea id="plates" name="plates" placeholder="HHL32H, AA11BB, CC22DD&#10;or one plate per line" required class="form-input min-h-[80px] resize-y"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="btn-success w-full btn-press">Save mapping</button>
        </form>
    </div>

    <!-- Residents table section -->
    <div class="bg-white rounded-xl border border-slate-200/80 overflow-hidden">
        <div class="px-5 sm:px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-wrap gap-3">
            <h2 class="text-base font-semibold text-slate-800">Existing residents</h2>
            <div class="flex items-center gap-2 flex-wrap">
                <button id="deleteSelected" class="btn-danger btn-press text-xs" disabled>Delete selected</button>
                <button id="exportExcel" class="btn-secondary btn-press text-xs">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    Export Excel
                </button>
            </div>
        </div>

        <div id="residentsContainer" class="p-5 sm:p-6">
            <div class="flex items-center justify-center gap-3 py-8 text-slate-400">
                <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <span class="text-sm">Loading residents...</span>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="hidden px-5 sm:px-6 py-3 border-t border-slate-100 bg-slate-50/50 flex items-center justify-center gap-2 flex-wrap text-sm">
            <button id="prevPage" class="btn-ghost text-xs disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
            <span class="text-xs text-slate-500" id="pageInfo"></span>
            <button id="nextPage" class="btn-ghost text-xs disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
            <button id="allPage" class="btn-ghost text-xs text-indigo-600">Show All</button>
        </div>
    </div>

</main>

<script src="/common.js"></script>
<script>
    requireAuth();
    requireAdmin();
    renderNavDrawer('residents');
    loadCurrentUser();

    const form = document.getElementById('resident-form');
    const submitBtn = document.getElementById('submit-btn');
    const residentsContainer = document.getElementById('residentsContainer');

    const uniqueCodeInput = document.getElementById('uniqueCode');
    const platesInput = document.getElementById('plates');

    const paginationEl = document.getElementById('pagination');
    const prevPageBtn = document.getElementById('prevPage');
    const nextPageBtn = document.getElementById('nextPage');
    const allPageBtn = document.getElementById('allPage');
    const deleteSelectedBtn = document.getElementById('deleteSelected');
    const exportExcelBtn = document.getElementById('exportExcel');
    const pageInfoEl = document.getElementById('pageInfo');

    let allResidents = [];
    let currentPage = 1;
    const pageSize = 10;
    let showAll = false;
    let selectedIds = new Set();

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const uniqueCode = uniqueCodeInput.value.trim();
        const rawPlates = platesInput.value;

        if (!uniqueCode || !rawPlates.trim()) {
            showToast('Please fill in both fields', 'warning');
            return;
        }

        const licensePlates = rawPlates
            .split(/[\n,]+/)
            .map(p => p.trim().toUpperCase())
            .filter(p => p.length > 0);

        if (licensePlates.length === 0) {
            showToast('Please enter at least one valid plate', 'warning');
            return;
        }

        setBtnLoading(submitBtn, true, 'Saving...');

        try {
            const response = await fetch(`/residents/${encodeURIComponent(uniqueCode)}/plates`, {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ licensePlates })
            });

            if (response.ok) {
                showToast('Resident mapping saved', 'success');
                platesInput.value = '';
                await loadResidents();
            } else {
                showToast('Error: ' + response.status, 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        } finally {
            setBtnLoading(submitBtn, false, 'Save mapping');
        }
    });

    async function loadResidents() {
        showSpinner(residentsContainer, 'Loading residents...');
        paginationEl.classList.add('hidden');
        showAll = false;
        currentPage = 1;
        selectedIds.clear();
        updateDeleteSelectedButton();

        try {
            const response = await fetch('/residents', { headers: getAuthHeaders() });
            if (!checkAuth(response)) return;
            if (!response.ok) {
                residentsContainer.innerHTML = `<p class="text-sm text-rose-500 text-center py-4">Error loading residents: ${response.status}</p>`;
                return;
            }

            allResidents = await response.json();
            if (allResidents.length === 0) {
                residentsContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">No residents yet.</p>';
                return;
            }

            renderResidentsPage();
        } catch (err) {
            residentsContainer.innerHTML = `<p class="text-sm text-rose-500 text-center py-4">Network error: ${err.message}</p>`;
        }
    }

    function renderResidentsPage() {
        residentsContainer.innerHTML = '';

        const total = allResidents.length;
        if (total === 0) {
            residentsContainer.innerHTML = '<p class="text-sm text-slate-400 text-center py-8">No residents yet.</p>';
            paginationEl.classList.add('hidden');
            return;
        }

        let pageItems, totalPages;

        if (showAll) {
            pageItems = allResidents;
            totalPages = 1;
            currentPage = 1;
        } else {
            totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;
            const startIndex = (currentPage - 1) * pageSize;
            pageItems = allResidents.slice(startIndex, startIndex + pageSize);
        }

        // Build table
        const wrapper = document.createElement('div');
        wrapper.className = 'overflow-x-auto -mx-5 sm:-mx-6';

        const table = document.createElement('table');
        table.className = 'data-table';

        const thead = document.createElement('thead');
        thead.innerHTML = `
            <tr>
                <th class="w-10 text-center"><input type="checkbox" id="selectAll" class="rounded border-slate-300 cursor-pointer"></th>
                <th>Code</th>
                <th>License Plates</th>
                <th>Actions</th>
            </tr>
        `;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        pageItems.forEach(r => {
            const tr = document.createElement('tr');

            // Checkbox
            const tdSelect = document.createElement('td');
            tdSelect.className = 'text-center';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'rounded border-slate-300 cursor-pointer';
            checkbox.dataset.residentId = r.id;
            checkbox.checked = selectedIds.has(r.id);
            checkbox.addEventListener('change', (e) => {
                if (e.target.checked) selectedIds.add(r.id);
                else selectedIds.delete(r.id);
                updateDeleteSelectedButton();
                const selectAllCb = table.querySelector('#selectAll');
                if (selectAllCb) selectAllCb.checked = pageItems.every(item => selectedIds.has(item.id));
            });
            tdSelect.appendChild(checkbox);
            tr.appendChild(tdSelect);

            // Code
            const tdCode = document.createElement('td');
            tdCode.innerHTML = `<span class="inline-block px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-xs font-semibold font-mono">${r.uniqueCode}</span>`;
            tr.appendChild(tdCode);

            // Plates
            const tdPlates = document.createElement('td');
            const platesHtml = (r.licensePlates && r.licensePlates.length > 0)
                ? r.licensePlates.map(p => `<span class="inline-block px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-700 text-xs font-mono mr-1 mb-1">${p}</span>`).join('')
                : '<span class="text-slate-300 text-xs">None</span>';
            tdPlates.innerHTML = platesHtml;
            tr.appendChild(tdPlates);

            // Actions
            const tdActions = document.createElement('td');
            tdActions.className = 'whitespace-nowrap';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-ghost text-xs text-indigo-600 hover:text-indigo-800';
            editBtn.textContent = 'Edit';
            editBtn.addEventListener('click', () => {
                uniqueCodeInput.value = r.uniqueCode;
                platesInput.value = (r.licensePlates || []).join('\n');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast('Editing resident ' + r.uniqueCode, 'info', 2000);
            });
            tdActions.appendChild(editBtn);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-ghost text-xs text-rose-600 hover:text-rose-800';
            deleteBtn.textContent = 'Delete';
            deleteBtn.addEventListener('click', async () => {
                if (!confirm(`Delete resident ${r.uniqueCode} and all its plates?`)) return;
                try {
                    const delRes = await fetch(`/residents/${r.id}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                    if (delRes.ok || delRes.status === 204) {
                        showToast('Resident deleted', 'success');
                        selectedIds.delete(r.id);
                        await loadResidents();
                    } else {
                        showToast('Error deleting resident: ' + delRes.status, 'error');
                    }
                } catch (err) {
                    showToast('Network error: ' + err.message, 'error');
                }
            });
            tdActions.appendChild(deleteBtn);

            tr.appendChild(tdActions);
            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        wrapper.appendChild(table);
        residentsContainer.appendChild(wrapper);

        // Select all checkbox behavior
        const selectAllCb = table.querySelector('#selectAll');
        if (selectAllCb) {
            selectAllCb.checked = pageItems.every(item => selectedIds.has(item.id));
            selectAllCb.addEventListener('change', (e) => {
                pageItems.forEach(r => {
                    if (e.target.checked) selectedIds.add(r.id);
                    else selectedIds.delete(r.id);
                });
                table.querySelectorAll('input[type="checkbox"][data-resident-id]').forEach(cb => {
                    cb.checked = selectedIds.has(Number(cb.dataset.residentId));
                });
                updateDeleteSelectedButton();
            });
        }

        // Pagination controls
        paginationEl.classList.remove('hidden');

        if (showAll) {
            pageInfoEl.textContent = `All (${total} residents)`;
            prevPageBtn.disabled = true;
            nextPageBtn.disabled = true;
            allPageBtn.disabled = true;
        } else {
            pageInfoEl.textContent = `Page ${currentPage} of ${totalPages} \u00b7 ${total} residents`;
            prevPageBtn.disabled = currentPage === 1;
            nextPageBtn.disabled = currentPage === totalPages;
            allPageBtn.disabled = false;
        }

        updateDeleteSelectedButton();
    }

    function updateDeleteSelectedButton() {
        if (selectedIds.size > 0) {
            deleteSelectedBtn.disabled = false;
            deleteSelectedBtn.textContent = `Delete selected (${selectedIds.size})`;
        } else {
            deleteSelectedBtn.disabled = true;
            deleteSelectedBtn.textContent = 'Delete selected';
        }
    }

    prevPageBtn.addEventListener('click', () => { showAll = false; currentPage--; renderResidentsPage(); });
    nextPageBtn.addEventListener('click', () => { showAll = false; currentPage++; renderResidentsPage(); });
    allPageBtn.addEventListener('click', () => { showAll = true; renderResidentsPage(); });

    deleteSelectedBtn.addEventListener('click', async () => {
        if (selectedIds.size === 0) return;
        if (!confirm(`Delete ${selectedIds.size} residents and all their plates?`)) return;
        try {
            const res = await fetch('/residents/bulk-delete', {
                method: 'POST',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ ids: Array.from(selectedIds) })
            });
            if (res.ok || res.status === 204) {
                showToast('Selected residents deleted', 'success');
                selectedIds.clear();
                await loadResidents();
            } else {
                showToast('Error deleting: ' + res.status, 'error');
            }
        } catch (err) {
            showToast('Network error: ' + err.message, 'error');
        }
    });

    // Export to Excel
    exportExcelBtn.addEventListener('click', async () => {
        setBtnLoading(exportExcelBtn, true, 'Exporting...');
        try {
            const response = await fetch('/residents/export/excel', { headers: getAuthHeaders() });
            if (!response.ok) throw new Error('Export failed: ' + response.status);

            const contentDisposition = response.headers.get('Content-Disposition');
            let filename = 'residents.xlsx';
            if (contentDisposition) {
                const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                if (match && match[1]) filename = match[1].replace(/['"]/g, '');
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            a.remove();

            showToast('Excel exported successfully', 'success');
        } catch (err) {
            showToast('Export failed: ' + err.message, 'error');
        } finally {
            setBtnLoading(exportExcelBtn, false, 'Export Excel');
        }
    });

    loadResidents();
</script>

</body>
</html>
